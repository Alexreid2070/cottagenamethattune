plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
    id "androidx.navigation.safeargs"
    id 'org.jetbrains.kotlin.plugin.serialization'
}

android {
    namespace 'com.isrbet.cottagegames'
    compileSdk = 37
    dataBinding {
        enabled = true
    }
    defaultConfig {
        applicationId "com.isrbet.cottagegames"
        minSdk 29
        targetSdk 37
        versionCode 2
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding = true
    }
}

dependencies {
    implementation 'androidx.compose.animation:animation-core:1.12.0'
    implementation 'androidx.compose.animation:animation:1.12.0'
    implementation 'androidx.compose.runtime:runtime:1.12.0'
    implementation 'androidx.core:core-ktx:1.19.0'
    implementation 'androidx.fragment:fragment-ktx:1.9.0'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.11.0'
    implementation 'androidx.navigation:navigation-fragment-ktx:2.9.8'
    implementation 'androidx.navigation:navigation-ui-ktx:2.9.8'
    implementation 'com.google.code.gson:gson:2.14.0'
    implementation files('../app-remote-lib/spotify-app-remote-release-0.7.2.aar')
    implementation 'com.google.firebase:firebase-database:22.0.1'
    // Firebase SDK
    implementation platform('com.google.firebase:firebase-bom:34.17.0')
    implementation 'com.google.firebase:firebase-database'
    implementation 'com.google.firebase:firebase-storage'
    implementation 'com.google.firebase:firebase-auth'
    // Firebase UI Library
    implementation 'com.firebaseui:firebase-ui-auth:9.1.1'
    implementation 'com.firebaseui:firebase-ui-database:9.1.1'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    // Google Sign In SDK
    implementation 'com.google.android.gms:play-services-auth:21.6.0'
    implementation 'com.github.bumptech.glide:glide:5.0.9'
    implementation("androidx.credentials:credentials:1.6.0")
    implementation("androidx.credentials:credentials-play-services-auth:1.6.0")
    implementation "com.google.android.libraries.identity.googleid:googleid:1.2.0"
    implementation("com.google.android.play:app-update:2.1.0")
    implementation("com.google.android.play:app-update-ktx:2.1.0")
    implementation("com.jakewharton.timber:timber:5.0.1")
    implementation 'nl.dionsegijn:konfetti:1.3.2'
    implementation("io.ktor:ktor-client-logging:3.5.2")
    implementation("io.ktor:ktor-client-core:3.5.2")
    implementation("io.ktor:ktor-client-android:3.5.2")
    implementation("io.ktor:ktor-client-content-negotiation:3.5.2")
    implementation("io.ktor:ktor-client-cio:3.5.2") // or another engine like android/content
    implementation("io.ktor:ktor-serialization-kotlinx-json:3.5.2")
    implementation("org.jetbrains.kotlinx:kotlinx-serialization-json:1.11.0")}

kotlin {
    jvmToolchain(17)
}